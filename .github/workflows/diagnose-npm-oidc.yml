name: Diagnose npm OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Show the claims GitHub signs for npm
        run: |
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$JWT" > "$RUNNER_TEMP/jwt"
          jq -R 'split(".")[1] | @base64d | fromjson | {iss, sub, aud, repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, event_name}' "$RUNNER_TEMP/jwt"

      - name: Ask npm to exchange the token for each package
        run: |
          JWT=$(cat "$RUNNER_TEMP/jwt")
          for PKG in core plugin generator; do
            STATUS=$(curl -sS -o "$RUNNER_TEMP/body.json" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $JWT" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@kubejs%2F$PKG")
            echo "@kubejs/$PKG -> HTTP $STATUS"
            jq 'del(.token)' "$RUNNER_TEMP/body.json" || head -c 400 "$RUNNER_TEMP/body.json"
          done
